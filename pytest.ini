[pytest]
# La raiz del proyecto entra al path para poder importar config, motor y simulacion.
pythonpath = .
testpaths = tests

# La corrida de tests tiene que terminar con CERO avisos. Un DeprecationWarning
# o un FutureWarning suele ser el primer sintoma de un cambio de comportamiento
# silencioso (unidades de tiempo, zonas horarias, manejo de NaN), justo la clase
# de error que en este proyecto no avisa de ninguna otra forma.
#
# Si alguna vez un aviso viene de una libreria externa y no se puede evitar, se
# silencia SOLO ese caso, con su propio filtro y un comentario que explique por
# que es inevitable. Nunca se apaga la regla completa.
filterwarnings =
    error::DeprecationWarning
    error::FutureWarning
